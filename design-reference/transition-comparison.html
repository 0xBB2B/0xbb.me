<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景过渡对比</title><link rel="stylesheet" href="./scene-comparison.css"><link rel="stylesheet" href="./transition-comparison.css"></head>
<body>
<header class="page-head"><div><p class="eyebrow">FUBUKI_BB · TRANSITION STUDIES / B＋2</p><h1>不是换一层颜色，而是把两个世界接起来。</h1><p>三版过渡方案，每版展示两处连接 · 保持小镇、数据工厂与荧光海的已选方向</p></div><a href="/">返回主页 ↗</a></header>
<div class="design-note"><b>共同改法</b><span>高墙后退或分层 → 背景提前露出 → 道路交错接入 → 近景错开边界</span><p>以下是独立的三维过渡样板，不修改正式主页。点击放大后可切换左侧／连接处／右侧，观察过渡过程。</p></div>
<main id="transitions"></main>
<footer class="selection"><div><span class="eyebrow">YOUR TRANSITION</span><p id="selection-text" aria-live="polite">推荐 1 错层衔接，也可以两处分别挑不同版本。</p></div><button id="copy-selection" disabled>复制选择</button></footer>
<dialog id="transition-dialog"><header><strong id="large-title"></strong><button id="close-large" aria-label="关闭放大画面">关闭 ×</button></header><div class="view-controls" aria-label="观察位置"><button data-offset="-3">← 左侧</button><button data-offset="0" aria-pressed="true">连接处</button><button data-offset="3">右侧 →</button><span>仅调整样板观察位置，不改变正式镜头</span></div><div id="large-stage" class="stage"></div><p id="large-description"></p></dialog>
<script type="module" src="./transition-comparison.ts"></script>
</body></html>
